name: LLM Eval

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 本次评测的标签（用于报告文件名）
        required: false
        default: manual

jobs:
  # ------------------------------------------------------------------
  # 第一层：框架自检。不消耗任何 API 额度，任何 PR 都必须通过。
  # ------------------------------------------------------------------
  smoke:
    name: 框架自检（Mock 模型）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试 + 端到端冒烟
        run: pytest -q

      - name: 生成基线报告
        run: python scripts/run_eval.py --models mock-baseline --no-embedding --tag ci-baseline

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-baseline
          path: reports/
          retention-days: 14

  # ------------------------------------------------------------------
  # 第二层：真实模型回归。仅手动触发，需要仓库 Secrets 中配置 API Key。
  # 这一步会消耗额度，所以不放在每次 push 上。
  # ------------------------------------------------------------------
  regression:
    name: 真实模型回归
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name == 'workflow_dispatch'
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行真实模型评测
        run: python scripts/run_eval.py --tag ${{ github.event.inputs.tag }}

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-real
          path: reports/
          retention-days: 30

      # 与仓库中保存的历史基线报告做对比，退化则本步骤失败
      - name: 与基线对比（回归门禁）
        if: hashFiles('reports/baseline/baseline.json') != ''
        run: |
          LATEST=$(ls -t reports/report-*.json | head -n 1)
          python scripts/check_regression.py \
            --current "$LATEST" \
            --baseline reports/baseline/baseline.json \
            --tolerance 0.02
